# Ubuntu/Linux override for the activity-recognition service.
#
# Usage (from the project root on the Ubuntu host):
#   cp ubuntu/.env.ubuntu .env
#   docker compose -f docker-compose.yml -f ubuntu/docker-compose.ubuntu.yml up -d
#
# Why an override:
#  - The Ubuntu host loads the image transferred from the Windows build host
#    (activity-recognition:2.0.0 with all model weights baked in: Qwen3-VL-8B
#    AWQ, Qwen2.5-Omni-3B and faster-whisper large-v3). No build is needed
#    and the stack runs fully offline.
#  - The main compose file stays untouched and remains valid for the Windows host.
services:
  activity-recognition:
    image: activity-recognition:2.0.0
    build: !reset null
